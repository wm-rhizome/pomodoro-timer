<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.6s ease;
    }

    body.work-mode {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }

    body.break-mode {
      background: linear-gradient(135deg, #0a3d2e 0%, #0e4d3a 50%, #126e50 100%);
    }

    .container {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 460px;
      width: 100%;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .phase-label {
      font-size: 1rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 2.5rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.4s ease;
    }

    .timer-ring {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 2.5rem;
    }

    .timer-ring svg {
      transform: rotate(-90deg);
      width: 280px;
      height: 280px;
    }

    .timer-ring .bg-ring {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 8;
    }

    .timer-ring .progress-ring {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease, stroke 0.4s ease;
    }

    body.work-mode .progress-ring {
      stroke: #e94560;
    }

    body.break-mode .progress-ring {
      stroke: #2ecc71;
    }

    .timer-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      font-weight: 300;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .btn {
      border: none;
      border-radius: 50px;
      padding: 0.75rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      outline: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-start {
      background: #e94560;
      color: #fff;
    }

    .btn-start:hover {
      background: #d63851;
      box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
    }

    .btn-pause {
      background: #f0a500;
      color: #1a1a2e;
    }

    .btn-pause:hover {
      background: #d99400;
      box-shadow: 0 4px 20px rgba(240, 165, 0, 0.4);
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.8);
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
    }

    .sessions {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 50px;
      padding: 0.6rem 1.4rem;
    }

    .sessions-icon {
      font-size: 1.1rem;
    }

    .sessions-text {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
    }

    .sessions-count {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    @media (max-width: 480px) {
      .timer-ring {
        width: 220px;
        height: 220px;
      }

      .timer-ring svg {
        width: 220px;
        height: 220px;
      }

      .timer-display {
        font-size: 3rem;
      }

      .btn {
        padding: 0.65rem 1.4rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body class="work-mode">
  <div class="container">
    <h1>Pomodoro Timer</h1>
    <div class="phase-label" id="phaseLabel">Work Session</div>

    <div class="timer-ring">
      <svg viewBox="0 0 280 280">
        <circle class="bg-ring" cx="140" cy="140" r="124"></circle>
        <circle class="progress-ring" id="progressRing" cx="140" cy="140" r="124"></circle>
      </svg>
      <div class="timer-display" id="timerDisplay">25:00</div>
    </div>

    <div class="controls">
      <button class="btn btn-start" id="startBtn">Start</button>
      <button class="btn btn-reset" id="resetBtn">Reset</button>
    </div>

    <div class="sessions">
      <span class="sessions-icon">&#10003;</span>
      <span class="sessions-text">Completed:</span>
      <span class="sessions-count" id="sessionCount">0</span>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const WORK_DURATION = 25 * 60;
      const BREAK_DURATION = 5 * 60;

      const RADIUS = 124;
      const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

      const progressRing = document.getElementById('progressRing');
      const timerDisplay = document.getElementById('timerDisplay');
      const phaseLabel = document.getElementById('phaseLabel');
      const startBtn = document.getElementById('startBtn');
      const resetBtn = document.getElementById('resetBtn');
      const sessionCountEl = document.getElementById('sessionCount');

      let timeRemaining = WORK_DURATION;
      let totalTime = WORK_DURATION;
      let timerInterval = null;
      let isRunning = false;
      let isWorkPhase = true;
      let completedSessions = 0;

      // Initialize the progress ring
      progressRing.style.strokeDasharray = CIRCUMFERENCE;
      progressRing.style.strokeDashoffset = '0';

      function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      function updateDisplay() {
        timerDisplay.textContent = formatTime(timeRemaining);

        const elapsed = totalTime - timeRemaining;
        const offset = (elapsed / totalTime) * CIRCUMFERENCE;
        progressRing.style.strokeDashoffset = offset;
      }

      function tick() {
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          isRunning = false;

          if (isWorkPhase) {
            completedSessions++;
            sessionCountEl.textContent = completedSessions;
            switchToBreak();
          } else {
            switchToWork();
          }

          // Auto-start the next phase
          startTimer();
          return;
        }

        timeRemaining--;
        updateDisplay();
      }

      function startTimer() {
        if (isRunning) return;
        isRunning = true;
        startBtn.textContent = 'Pause';
        startBtn.className = 'btn btn-pause';
        timerInterval = setInterval(tick, 1000);
      }

      function pauseTimer() {
        if (!isRunning) return;
        isRunning = false;
        clearInterval(timerInterval);
        timerInterval = null;
        startBtn.textContent = 'Start';
        startBtn.className = 'btn btn-start';
      }

      function resetTimer() {
        pauseTimer();
        isWorkPhase = true;
        timeRemaining = WORK_DURATION;
        totalTime = WORK_DURATION;
        document.body.className = 'work-mode';
        phaseLabel.textContent = 'Work Session';
        updateDisplay();
      }

      function switchToBreak() {
        isWorkPhase = false;
        timeRemaining = BREAK_DURATION;
        totalTime = BREAK_DURATION;
        document.body.className = 'break-mode';
        phaseLabel.textContent = 'Break Time';
        updateDisplay();
      }

      function switchToWork() {
        isWorkPhase = true;
        timeRemaining = WORK_DURATION;
        totalTime = WORK_DURATION;
        document.body.className = 'work-mode';
        phaseLabel.textContent = 'Work Session';
        updateDisplay();
      }

      startBtn.addEventListener('click', function () {
        if (isRunning) {
          pauseTimer();
        } else {
          startTimer();
        }
      });

      resetBtn.addEventListener('click', resetTimer);

      // Initial render
      updateDisplay();
    })();
  </script>
</body>
</html>
